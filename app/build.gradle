plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myvoltalis.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.myvoltalis.widget'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK is directly installable.
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = 'OurVoltalisWidget.apk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
